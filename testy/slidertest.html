<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Width Slider</title>
    <link rel="stylesheet" href="slidertest.css">
</head>
<body>
    <div class="slider">
        <div class="slides">
            <div class="slide"><img src="../images/WM-Grubas-poza-zloczyncy-podpis-bez-logo.png" alt="Slide 1"></div>
            <div class="slide"><img src="../images/boner-sm.png" alt="Slide 2"></div>
            <div class="slide"><img src="../images/amerykanski zolnierz.png" alt="Slide 3"></div>
        </div>
        <div class="navigation">
            <button class="nav-btn" onclick="goToSlide(0)">1</button>
            <button class="nav-btn" onclick="goToSlide(1)">2</button>
            <button class="nav-btn" onclick="goToSlide(2)">3</button>
        </div>
    </div>
    <script src="slidertest.js"></script>
</body>
</html>
